name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish bower
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/bower
          VERSION: ${{ github.ref_name }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

      - name: Build and publish bower-proxy
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/bower-proxy
          VERSION: ${{ github.ref_name }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --file proxy/Dockerfile.caddy \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            proxy
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

      - name: Build and publish bower-proxy-sync
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/bower-proxy-sync
          VERSION: ${{ github.ref_name }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --file proxy/Dockerfile.agent \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            proxy
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          generate_release_notes: true
