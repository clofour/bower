name: proxy-images

on:
  push:
    branches: [main]
    paths: [proxy/**, .github/workflows/proxy-images.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: canopy-caddy
            file: proxy/Dockerfile.caddy
          - name: canopy-proxy-sync
            file: proxy/Dockerfile.agent
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: proxy
          file: ${{ matrix.image.file }}
          push: true
          tags: ghcr.io/clofour/${{ matrix.image.name }}:latest
